[project]
name = "ar-lokal-ai-service"
version = "0.1.0"
description = "AR-LOKAL internal AI service: image validation + TripoSR reconstruction"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "models: needs downloaded model weights (ISNet, YOLOX; MediaPipe/OpenCLIP when installed)",
  "gpu: needs a CUDA GPU and real TripoSR weights",
  "torch: needs PyTorch (runs the real TripoSR code with a tiny random model)",
  "stack: needs a running Supabase stack (AILOKAL_TEST_SUPABASE_URL/KEY)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = ["third_party"]  # vendored upstream code, kept as-is (see AR-LOKAL-PATCHES.md)

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "BLE"]
ignore = ["S101", "S311", "B008", "E501"]  # long user-facing strings; formatter owns wrapping

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "N802"]
"scripts/*" = ["S"]
